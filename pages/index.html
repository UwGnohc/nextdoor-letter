<script>
'use strict';
const $=id=>document.getElementById(id);
const memberNames=['SUNGHO','RIWOO','JAEHYUN','TAESAN','LEEHAN','WOONHAK'];
const zone='Asia/Shanghai', dateFields={timeZone:zone};
const dayKey=new Intl.DateTimeFormat('sv-SE',{...dateFields,year:'numeric',month:'2-digit',day:'2-digit'});
const withTime=new Intl.DateTimeFormat('zh-CN',{...dateFields,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const clock=new Intl.DateTimeFormat('zh-CN',{...dateFields,hour:'2-digit',minute:'2-digit',hour12:false});
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function icon(name){const n=document.createElementNS('http://www.w3.org/2000/svg','svg');const use=document.createElementNS(n.namespaceURI,'use');n.setAttribute('class','icon');n.setAttribute('aria-hidden','true');use.setAttribute('href','#'+name);n.append(use);return n}
function dateValue(raw){if(!raw)return null;const value=String(raw);const dayOnly=/^\d{4}-\d{2}-\d{2}$/.test(value);const date=new Date(dayOnly?value+'T12:00:00+08:00':value);return Number.isNaN(date.getTime())?null:{date,dayOnly}}
function format(raw){const v=dateValue(raw);return v?(v.dayOnly?dayKey.format(v.date):withTime.format(v.date)):'时间待确认'}
function safeLink(title,url,cls){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();const a=node('a',cls,title);a.href=u.href;a.rel='noopener noreferrer';a.target='_blank';return a}catch{return node('span',cls,title)}}
function loadRead(){try{const old=JSON.parse(localStorage.getItem('bnd-mail.read')||'[]');return new Set(Array.isArray(old)?old:[])}catch{return new Set()}}
const localFile=location.protocol==='file:';
const read=loadRead();let items=[],events=[],sources=[],current='',onlyUnread=false,limit=3,lastData='',priorIds=null,added=new Set(),ready=false,working=false;
const communityFallback={name:'r/BOYNEXTDOOR_',url:'https://www.reddit.com/r/BOYNEXTDOOR_/',mode:'link',ok:null,region:'国际'};
const communityTabs=document.querySelectorAll('.neighbor-tabs button');
const communityPageSize=3;
let communityItems=[],communitySources=[],communityUpdated='',communityFilter='',communityPage=1;
let communityContentKey='',communitySourcesKey='',communityLoading=true,communityOffline=localFile;
let communityRegion='',communityRegionKey='',communityManual=false,communityProblem='',communityWarning='';
const translationState=new Map();
const languageNames=new Intl.DisplayNames('zh-CN',{type:'language'});
const getCommunitySource=item=>communitySources.find(s=>s.name===item.source);
function sourceRegion(item,source=getCommunitySource(item)){
 const region=String(item.region||source?.region||'').trim();
 if(region)return ({JP:'日本',KR:'韩国',CN:'中国',global:'国际'})[region]||region;
 const name=item.source||item.name||'';
 if(/KSD|韩星网|微博|哔哩哔哩/.test(name))return '中文圈';
 if(/Mastodon|Reddit|K-Pop Source/i.test(name))return '国际';
 return '';
}
function titleLanguage(item){
 const lang=String(item.language||item.lang||'').toLowerCase();
 if(lang&&lang!=='und')return lang;
 const title=item.title||'';
 if(/[\u3041-\u30ff]/u.test(title))return 'ja';
 if(/[\uac00-\ud7af\u1100-\u11ff]/u.test(title))return 'ko';
 if(item.title_zh?.trim()===title.trim()&&/\p{Script=Han}/u.test(title))return 'zh';
 const declared=String(getCommunitySource(item)?.language||'').toLowerCase();
 return declared&&declared!=='und'?declared:'und';
}
function languageLabel(code){
 if(!code||code==='und')return '';
 try{return languageNames.of(code)||''}catch{return ''}
}
function needsTranslation(item){return !!item.title?.trim()&&!/^zh(?:-|$)|^cmn(?:-|$)|^yue(?:-|$)/i.test(titleLanguage(item))}
function existingTranslation(item){const value=(item.title_zh||'').trim();return value&&value!==item.title?.trim()?value:''}
async function onDeviceTranslation(item){
 const api=window.Translator,lang=titleLanguage(item);
 if(!api?.availability||!api?.create||lang==='und')return '';
 let translator;
 try{
  const pair={sourceLanguage:lang,targetLanguage:'zh'};
  if(await api.availability(pair)!=='available')return '';
  translator=await api.create(pair);
  const translated=await translator.translate(item.title);
  return typeof translated==='string'?translated.trim():'';
 }catch{return ''}
 finally{translator?.destroy?.()}
}
function translationControl(item){
 const box=node('div','neighbor-translation'),button=node('button','translation-button'),body=node('p','translation-body');
 const web=new URL('https://translate.google.com/');web.search=new URLSearchParams({sl:'auto',tl:'zh-CN',text:item.title,op:'translate'}).toString();
 const fallback=safeLink('打开网页版翻译',web.href,'translation-fallback');fallback.append(icon('out'));fallback.hidden=true;
 fallback.title='在 Google 翻译中打开这条标题';
 const key=JSON.stringify([item.id||item.url,item.title]);
 let state=translationState.get(key);
 if(!state){state={open:false,busy:false,text:'',error:''};translationState.set(key,state)}
 const local=existingTranslation(item);
 function paint(){
  button.textContent=state.busy?'翻译中…':state.open?'收起':'翻译';
  button.disabled=state.busy;button.setAttribute('aria-expanded',String(state.open));
  button.title=local||state.text?'显示或收起中文标题':'使用浏览器翻译或打开网页版翻译';
  body.hidden=!state.open;body.textContent=state.busy?'正在翻译标题…':state.error||state.text||local;
  body.title=state.error?'':state.provider||'已保存的中文标题';
  fallback.hidden=!state.open||!state.error;
 }
 state.render=paint;body.setAttribute('role','status');
 button.onclick=async()=>{
  if(state.busy)return;
  if(state.open){state.open=false;paint();return}
  state.open=true;state.error='';
  if(local||state.text){paint();return}
  state.busy=true;paint();
  try{
   state.text=await onDeviceTranslation(item);
   if(state.text){state.provider='浏览器本机翻译';return}
   state.error='这条标题还没有中文译文，可以在 Google 翻译中查看。';
  }catch{state.error='当前浏览器翻译不可用。'}
  finally{state.busy=false;state.render()}
 };
 paint();box.append(button,body,fallback);return box;
}
function communityType(item){
 const label=String(item.kind||'');
 if(label==='媒体报道'||label==='media')return 'media';
 if(label.startsWith('官方')||label==='official')return 'official';
 return 'fan';
}
function neighborPost(item,showKind){
 const post=node('article','neighbor-post'),type=communityType(item);
 const category={fan:'粉丝讨论',media:'媒体报道',official:'官方发布'}[type];
 const meta=node('div','neighbor-meta'),date=dateValue(item.published_at),time=node('time');
 if(date){
  time.dateTime=item.published_at;time.title=format(item.published_at);
  time.textContent=dayKey.format(date.date)+(date.dayOnly?'':' '+clock.format(date.date));
 }else time.textContent='时间待确认';
 const lang=titleLanguage(item),where=sourceRegion(item),language=languageLabel(lang);
 const source=(item.source||'').replace(/\s*·\s*BOYNEXTDOOR$/i,'');
 const origin=node('span','neighbor-origin',[showKind?category:'',source,where,language].filter(Boolean).join(' · '));
 origin.title=[item.source,where?'来源地区：'+where:'',language?'标题语种：'+language:''].filter(Boolean).join(' · ');
 meta.append(origin,time);
 const title=node('h3'),link=safeLink(item.title||'查看原帖',item.url,'neighbor-title');
 if(lang!=='und')link.lang=lang;
 link.append(icon('out'));title.append(link);post.append(meta,title);
 if(needsTranslation(item))post.append(translationControl(item));return post;
}
function neighborSource(source){
 const where=sourceRegion(source,source);
 const row=node('div','neighbor-source'),link=safeLink(source.name+(where?' · '+where:''),source.url);
 if(link.tagName==='A')link.append(icon('out'));
 const direct=source.mode==='link';
 const cached=communityItems.some(item=>item.source===source.name);
 const status=direct?'直达原站':source.ok===false?(cached?'更新失败 · 有缓存':'暂不可用'):source.error?'部分更新':source.ok===true?'已更新':'待检查';
 const value=node('span',!direct&&(source.ok===false||source.error)?'bad':'',status);
 value.title=[source.updated_at?'上次成功 '+format(source.updated_at):'',source.error].filter(Boolean).join(' · ');
 row.append(link,value);return row;
}
function inCommunityRegion(item){return !communityRegion||sourceRegion(item)===communityRegion}
function paintRegions(){
 const regions=Array.from(new Set([...communityItems,...communitySources].map(item=>sourceRegion(item)).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'zh-CN'));
 if(communityRegion&&!regions.includes(communityRegion))regions.push(communityRegion);
 const key=JSON.stringify(regions);if(key===communityRegionKey)return;communityRegionKey=key;
 const select=$('community-region'),all=node('option','','全部地区');all.value='';
 select.replaceChildren(all,...regions.map(region=>{const opt=node('option','',region);opt.value=region;return opt}));select.value=communityRegion;
}
function selectedCommunityType(){
 if(communityFilter)return communityFilter;
 const rows=communityItems.filter(inCommunityRegion);
 return rows.some(i=>communityType(i)==='fan')||!rows.length?'fan':'all';
}
function paintCommunityPosts(filterChanged=false){
 const type=selectedCommunityType();
 for(const tab of communityTabs)tab.setAttribute('aria-pressed',String(tab.dataset.type===type));
 const rows=communityItems.filter(i=>inCommunityRegion(i)&&(type==='all'||communityType(i)===type));
 const list=$('community-news'),pages=Math.ceil(rows.length/communityPageSize),requestedPage=communityPage;
 communityPage=Math.min(Math.max(1,communityPage),Math.max(1,pages));
 const offset=(communityPage-1)*communityPageSize,visible=rows.slice(offset,offset+communityPageSize);
 const empty=communityLoading?'正在收取社区消息…':communityRegion?'当前地区与分类下暂无消息，可切换至全部地区或访问下方来源。':type==='media'?'暂未收录媒体报道，可在下方查看来源。':type==='fan'?'暂未收录粉丝帖子，可从下方直接逛社区。':'暂未收录消息，可从下方进入原站。';
 const key=JSON.stringify([visible,visible.map(i=>[titleLanguage(i),sourceRegion(i)]),rows.length,communityPage,type,visible.length?'':empty]);
 const focusInPosts=list.contains(document.activeElement);
 if(key===communityContentKey||(!filterChanged&&requestedPage===communityPage&&focusInPosts))return;
 communityContentKey=key;
 list.replaceChildren(...(visible.length?visible.map(item=>neighborPost(item,type==='all')):[node('p','neighbor-empty',empty)]));
 $('community-translation-note').hidden=!visible.some(i=>needsTranslation(i)&&!existingTranslation(i));
 $('community-pagination').hidden=!pages;
 $('community-prev').disabled=communityPage<=1;$('community-next').disabled=communityPage>=pages;
 $('community-page').textContent=pages?communityPage+' / '+pages+' 页':'';
 if(focusInPosts&&requestedPage!==communityPage)(list.querySelector('.neighbor-title')||$('community')).focus({preventScroll:true});
}
function paintCommunitySources(){
 const all=communitySources.length?communitySources:[communityFallback],host=$('community-sources');
 const key=JSON.stringify(all);
 if(key===communitySourcesKey||host.contains(document.activeElement))return;
 communitySourcesKey=key;host.replaceChildren(...all.map(neighborSource));
}
function updateCommunityStatus(){
 const messages=[];
 if(communityLoading)messages.push(communityItems.length?'正在读取最新发布':'正在读取讨论');
 else if(communityOffline)messages.push(communityItems.length?'当前显示本地缓存':'尚无本地讨论缓存');
 if(communityUpdated)messages.push('来源上次更新 '+format(communityUpdated));
 const unavailable=communitySources.filter(s=>s.mode!=='link'&&(s.ok===false||s.error));
 if(unavailable.length)messages.push(unavailable.length+' 个来源暂未完整更新');
 if(communityProblem)messages.push(communityProblem);
 if(communityWarning)messages.push(communityWarning.replace(/[。.]$/,''));
 if(!messages.length)messages.push('可从下方进入消息原站');
 const status=messages.join(' · ')+'。';if($('community-status').textContent!==status)$('community-status').textContent=status;
 const button=$('community-refresh'),busyNow=communityManual||communityLoading;
 button.disabled=busyNow;button.setAttribute('aria-busy',String(busyNow));button.querySelector('span').textContent=busyNow?'读取中':'更新讨论';
}
function showCommunity(community,loading,offline){
 const nextItems=Array.isArray(community?.items)?community.items:[];
 const nextSources=Array.isArray(community?.sources)?community.sources:[];
 const cachedAfterFailure=!!community?.error&&!nextItems.length&&communityItems.length>0;
 if(!cachedAfterFailure)communityItems=nextItems;
 if(!cachedAfterFailure||nextSources.length)communitySources=nextSources;
 communityUpdated=community?.updated_at||(cachedAfterFailure?communityUpdated:'');
 communityLoading=!offline&&(community?.refreshing??loading);communityOffline=offline;communityProblem=community?.error||'';communityWarning=community?.storage_warning||'';
 paintRegions();paintCommunityPosts();paintCommunitySources();updateCommunityStatus();
}
$('community-region').onchange=e=>{communityRegion=e.target.value;communityPage=1;paintCommunityPosts(true)};
$('community-refresh').onclick=()=>readEdition('community');
for(const tab of communityTabs){
 tab.onclick=()=>{communityFilter=tab.dataset.type;communityPage=1;paintCommunityPosts(true)};
}
$('community-prev').onclick=()=>{communityPage--;paintCommunityPosts(true)};
$('community-next').onclick=()=>{communityPage++;paintCommunityPosts(true)};
$('community-news').addEventListener('focusout',()=>setTimeout(paintCommunityPosts,0));
$('community-sources').addEventListener('focusout',()=>setTimeout(paintCommunitySources,0));
function members(i){return Array.isArray(i.members)?i.members.map(n=>String(n).toUpperCase()).filter(n=>memberNames.includes(n)):[]}
function saveRead(){try{localStorage.setItem('bnd-mail.read',JSON.stringify([...read].slice(-4000)))}catch{}}
function paintUnread(){const unread=items.filter(i=>!read.has(i.id)).length;$('unread-count').textContent=ready?String(unread):'…';$('unread').setAttribute('aria-pressed',String(onlyUnread));$('unread').firstChild.textContent=onlyUnread?'显示全部 ':'查看未读 ';document.body.classList.toggle('waiting',ready&&unread>0)}
function card(item){
 const n=node('article','news-card'+(added.has(item.id)?' new-in':'')),date=dateValue(item.published_at);
 n.dataset.id=item.id;n.tabIndex=-1;
 const stamp=node('div','stamp');stamp.setAttribute('aria-hidden','true');
 if(date){const parts=dayKey.format(date.date).split('-');stamp.append(node('span','',String(Number(parts[1]))+'月'),node('b','',parts[2]))}
 else{stamp.append(icon('mail'))}
 const copy=node('div'),meta=node('div','card-meta'),t=node('time','',format(item.published_at));
 if(date)t.dateTime=item.published_at;
 meta.append(node('span','kind',item.kind||'来源消息'),node('span','',item.source),t);
 if(!read.has(item.id))meta.append(node('span','fresh','未读'));
 const h=node('h3'),link=safeLink(item.title_zh||item.title||'查看原文',item.url);if(item.title_zh&&item.title)link.title=item.title;h.append(link);copy.append(meta,h);
 if(item.summary_zh&&item.summary_zh!==item.title_zh)copy.append(node('p','summary',item.summary_zh));
 const bottom=node('div','card-bottom');for(const m of members(item))bottom.append(node('span','member-tag',m));
 const origin=safeLink('查看原文',item.url,'external');origin.append(icon('out'));bottom.append(origin);copy.append(bottom);n.append(stamp,copy);
 n.addEventListener('click',e=>{if(!e.target.closest('a')||read.has(item.id))return;read.add(item.id);saveRead();n.querySelector('.fresh')?.remove();paintUnread();if(onlyUnread)setTimeout(list,0)});
 return n;
}
function list(){
 const rows=items.filter(i=>(!current||members(i).includes(current))&&(!onlyUnread||!read.has(i.id)));
 $('letter-title').textContent=onlyUnread?'未读来信':current?current+' 的来信':'最新来信';$('count').textContent=rows.length?'显示 '+Math.min(limit,rows.length)+' / '+rows.length+' 封':'';
 $('news').replaceChildren(...rows.slice(0,limit).map(card));$('more').hidden=rows.length<=limit;
 if(!rows.length){let msg='还没有收到来信。';if(current&&onlyUnread)msg='这个成员暂时没有未读来信。';else if(current)msg='当前来信中暂无明确提及 '+current+' 的消息。';else if(onlyUnread&&items.length)msg='所有来信都读完了。';else if(working)msg='正在检查消息来源…';else if(sources.some(s=>s.ok===false))msg='暂未取得来信，请查看来源状态后再刷新。';$('news').append(node('p','empty',msg))}
}
function markPlates(){for(const b of $('plates').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.name===current))}
for(const name of ['',...memberNames]){const b=node('button','plaque',name||'全员');b.dataset.name=name;b.onclick=()=>{current=name;limit=3;added.clear();markPlates();list()};$('plates').append(b)}
markPlates();
function eventCandidate(e,now,today){
 const start=dateValue(e.start_at),end=dateValue(e.end_at);if(!start)return null;
 const first=dayKey.format(start.date);const effective=end||start;
 const past=effective.dayOnly?dayKey.format(effective.date)<today:effective.date<now;
 if(past)return null;
 return {e,start,end,ongoing:(!!end&&((start.dayOnly&&first<=today)||(!start.dayOnly&&start.date<=now))),today:first===today,sort:first+(start.dayOnly?'':clock.format(start.date))};
}
function renderEvent(){
 const now=new Date(),today=dayKey.format(now),candidates=events.map(e=>eventCandidate(e,now,today)).filter(Boolean).sort((a,b)=>Number(b.ongoing)-Number(a.ongoing)||a.sort.localeCompare(b.sort));const c=candidates[0],body=$('event');body.replaceChildren();$('event-badge').hidden=!c;
 if(!c){body.append(node('p','quiet',working?'正在查看官方日程…':'暂未收到含明确日期的下一项官方行程。'));return}
 $('event-badge').textContent=c.ongoing?'进行中':c.today?'今天':'即将到来';
 let time=format(c.e.start_at);if(c.end)time+=' 至 '+format(c.e.end_at);
 body.append(node('time','event-date',time),safeLink(c.e.title_zh||c.e.title,c.e.url,'event-title'),node('p','event-src',c.e.source||'官方发布'));
}
function renderSources(){const rows=sources.map(s=>{const r=node('div','source-row'),info=node('span','source-state'),state=s.ok===true?(s.error?'部分更新':'已更新'):s.ok===false?'暂不可用':'待更新';r.append(safeLink(s.name,s.url));const label=node('span',s.ok===false||s.error?'bad':'',state);if(s.error)label.title=s.error;info.append(label);if(s.updated_at)info.append(node('br'),node('time','','上次成功 '+format(s.updated_at)));r.append(info);return r});$('sources').replaceChildren(...(rows.length?rows:[node('p','quiet','暂无来源状态。')]))}
function busy(yes){working=yes;document.body.classList.toggle('busy',yes);$('reload').disabled=yes;$('reload').querySelector('span').textContent=yes?'正在取信':'刷新来信'}
function show(data,withCommunity=true){
 if(!Array.isArray(data.items)||!Array.isArray(data.sources)||!Array.isArray(data.events))throw Error('不完整的数据');
 ready=true;busy(!!data.refreshing);items=data.items;sources=data.sources;events=data.events;
 const warning=data.storage_warning||'';
 if($('storage-note').textContent!==warning)$('storage-note').textContent=warning;
 const nextIds=new Set(items.map(i=>i.id));added=priorIds?new Set([...nextIds].filter(i=>!priorIds.has(i))):new Set();priorIds=nextIds;
 paintUnread();updateDoorLetter();$('last-update').textContent=data.updated_at?'上次更新 '+format(data.updated_at):(working?'正在取信…':'等待首次更新');
 const fingerprint=JSON.stringify([items,sources,working&&!items.length]);
 if(fingerprint!==lastData){lastData=fingerprint;list();renderSources()}
 renderEvent();if(withCommunity)showCommunity(data.community,working,localFile);
}
let edition='';
async function readEdition(section){
 const status=$(section==='community'?'community-feedback':'note');
 if(localFile){status.textContent='这是下载的版本。打开已发布的网站可以读取更新。';return}
 if(working||communityManual)return;
 busy(true);communityManual=true;updateCommunityStatus();status.textContent='正在读取最新发布…';
 try{
  const url=new URL('data.json',document.baseURI);
  url.searchParams.set('t',Date.now());
  const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});
  if(!response.ok)throw Error();
  const data=await response.json();
  if(!Array.isArray(data.community?.items))throw Error();
  show(data);
  const latest=data.published_at||data.updated_at;
  status.textContent=latest===edition?'已是最新发布版本。':'已载入本次发布。';
  edition=latest;
 }catch{status.textContent='暂时无法读取最新发布，仍可查看当前内容。'}
 finally{busy(false);communityManual=false;updateCommunityStatus()}
}
$('unread').onclick=()=>{onlyUnread=!onlyUnread;limit=3;added.clear();paintUnread();list();$('letters').scrollIntoView({block:'start'})};$('more').onclick=()=>{limit+=6;added.clear();list()};$('reload').onclick=()=>readEdition('official');
function updateDoorLetter(){
 const target=items.find(i=>!read.has(i.id))||items[0];
 const visible=$('door').getAttribute('aria-pressed')==='true'&&!!target;
 $('door-letter').hidden=!visible;$('door').parentElement.classList.toggle('has-letter',visible);
 if(visible)$('door-letter').title=target.title_zh||target.title||'拆一封来信';
}
$('door').onclick=()=>{const open=$('door').classList.toggle('open');$('door').setAttribute('aria-pressed',String(open));$('door').setAttribute('aria-label',open?'关上小门':'打开小门');$('door-hint').textContent=open?'轻敲关门':'轻敲开门';updateDoorLetter()};
$('door-letter').onclick=()=>{
 const index=items.findIndex(i=>!read.has(i.id)),target=items[Math.max(0,index)];if(!target)return;
 current='';onlyUnread=false;limit=Math.max(3,index+1);added.clear();read.add(target.id);saveRead();
 markPlates();paintUnread();updateDoorLetter();list();const chosen=Array.from($('news').children).find(n=>n.dataset.id===target.id);
 if(chosen){chosen.focus({preventScroll:true});chosen.scrollIntoView({block:'center'})}
};
const initial=JSON.parse($('initial-data').textContent);
edition=initial.published_at||initial.updated_at;
show(initial);
</script></body></html>
